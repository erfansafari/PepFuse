# Fusion Model Configuration: PeptideBERT + Graphormer Lite (Cross-Attention)
# =============================================================================

# Training parameters
epochs: 30
batch_size: 32
vocab_size: 25
task: hemo # hemo, sol, nf
augment: false
type: random_swap
debug: false

# Graph parameters
graph:
  k_hop: 2 # Maximum hop distance for graph edges
  use_one_hot: false
  readout: "mean" # Graph pooling method: "mean", "add", "max"

# PeptideBERT sequence encoder configuration
sequence:
  hidden_size: 480
  hidden_layers: 12
  attn_heads: 12
  dropout: 0.15

# Graphormer Lite graph encoder configuration
graph_encoder:
  hidden_dim: 128
  heads: 16
  num_layers: 4
  dropout: 0.01
  k_max: 3
  max_degree: 64
  use_degree: true

# Fusion configuration
fusion:
  fusion_type: "cross_attention" # "concat", "gated", or "cross_attention"
  hidden_dim: 256 # Hidden dimension for fusion MLP
  dropout: 0.01
  num_heads: 4 # Number of attention heads for cross-attention (only for cross_attention type)

# Optimizer configuration
optim:
  lr: 5.0e-6 # Lower learning rate for fusion model

# Scheduler configuration
sch:
  name: lronplateau
  factor: 0.1
  patience: 5

# Logging configuration
logging:
  wandb_project: PeptideBERT-Fusion
  log_interval: 10
